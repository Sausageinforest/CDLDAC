name: Build PS3 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile PKG via PS3DEV Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/build -w /build hldtux/ps3dev make clean pkg
          mkdir -p CDPL00001/USRDIR/assets CDPL00001/USRDIR/cache
          cp pkg/PARAM.SFO CDPL00001/
          cp pkg/ICON0.PNG CDPL00001/
          cp pkg/PIC1.PNG CDPL00001/
          cp assets/font.ttf CDPL00001/USRDIR/assets/
          cp assets/default_cover.png CDPL00001/USRDIR/assets/
          if [ -f CDPL00001.self ]; then cp CDPL00001.self CDPL00001/USRDIR/EBOOT.BIN; fi
          zip -r CDPL00001-folder.zip CDPL00001
          ls -la
          ls -la build/ || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CDPL00001-PS3-Package
          path: |
            *.pkg
            *.self
            CDPL00001/
            CDPL00001-folder.zip

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "PS3 Audiophile CD Player v1.0.3 (CDPL00001)"
          body: |
            Official PSL1GHT build of PS3 Audiophile CD Player homebrew (TitleID: CDPL00001).

            ### Fixes & Diagnostics in v1.0.3
            - Added **Multi-Destination Instant-Sync Logger** (`logger.c`):
              * Writes and fsyncs every step immediately to `/dev_usb000/cdplayer.log`, `/dev_usb001/cdplayer.log`, `/dev_hdd0/tmp/cdplayer.log`, and `/dev_hdd0/game/CDPL00001/debug.log`.
              * Allows reading startup diagnostics directly by plugging the USB flash drive into a PC.
            - Removed unneeded PRX `sysModuleLoad` calls that trigger fatal errors on built-in services.
            - Added safe mutex attribute zeroing and audio port configuration with `AUDIO_PORT_INITLEVEL`.
            - Checkpoints added for all 6 subsystems (Input, Network, Visualizer, Tiny3D, CD Drive, Audio Thread).
          files: |
            CDPL00001.pkg
            CDPL00001.gnpdrm.pkg
            CDPL00001.self
            CDPL00001-folder.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
