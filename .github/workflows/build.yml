name: Build PS3 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile PKG via PS3DEV Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/build -w /build hldtux/ps3dev make clean pkg
          mkdir -p CDPL00001/USRDIR/assets CDPL00001/USRDIR/cache
          if [ -f build/pkg/PARAM.SFO ]; then cp build/pkg/PARAM.SFO CDPL00001/ ; cp build/pkg/PARAM.SFO pkg/PARAM.SFO ; else cp pkg/PARAM.SFO CDPL00001/ ; fi
          cp pkg/ICON0.PNG CDPL00001/
          cp pkg/PIC1.PNG CDPL00001/
          cp assets/font.ttf CDPL00001/USRDIR/assets/
          cp assets/default_cover.png CDPL00001/USRDIR/assets/
          if [ -f CDPL00001.self ]; then cp CDPL00001.self CDPL00001/USRDIR/EBOOT.BIN; fi
          zip -r CDPL00001-folder.zip CDPL00001
          ls -la
          ls -la build/ || true

      - name: Finalize Retail PKG for PS3HEN
        run: |
          sudo chown -R runner:runner ${{ github.workspace }}
          pip install cryptography
          python3 tools/package_finalize.py CDPL00001.pkg CDPL00001.gnpdrm.pkg CDPL00001-fself.pkg
          python3 -c "with open('CDPL00001.pkg', 'rb') as f: print('CDPL00001.pkg finalized byte 4:', hex(f.read(5)[4]))"
          python3 -c "with open('CDPL00001-fself.pkg', 'rb') as f: print('CDPL00001-fself.pkg finalized byte 4:', hex(f.read(5)[4]))"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CDPL00001-PS3-Package
          path: |
            *.pkg
            *.self
            CDPL00001/
            CDPL00001-folder.zip

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "PS3 Audiophile CD Player v1.0.5 (CDPL00001)"
          body: |
            Official PSL1GHT build of PS3 Audiophile CD Player homebrew (TitleID: CDPL00001).

            ### Critical Fixes in v1.0.5
            - **Guaranteed Retail PKG Finalization**:
              * Added standalone `package_finalize.py` step to decrypt debug payload and encrypt with retail keys (sets `0x80` finalize flag).
              * Enables direct installation and execution on retail CEX consoles and PS3HEN without debug mode.
            - **Direct Kernel LV2 Logging (`sysFsOpen`)**:
              * Logger in `logger.c` now bypasses stdio/newlib and writes directly to LV2 kernel filesystem (`/dev_usb000`..`007`, `/dev_hdd0/tmp/cdplayer.log`).
            - **Sysutil Callback System**:
              * Registered `sysUtilRegisterCallback` and added `sysUtilCheckCallback` to main loop.
            - **Updated PARAM.SFO**:
              * Set `ATTRIBUTE: 165` and `PS3_SYSTEM_VER: 03.4000` matching standard PS3HEN homebrew configuration.
          files: |
            CDPL00001.pkg
            CDPL00001-fself.pkg
            CDPL00001.gnpdrm.pkg
            CDPL00001.self
            CDPL00001-folder.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
