name: Build PS3 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile PKG via PS3DEV Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/build -w /build hldtux/ps3dev make pkg
          mkdir -p CDPL00001/USRDIR/assets CDPL00001/USRDIR/cache
          cp pkg/PARAM.SFO CDPL00001/
          cp pkg/ICON0.PNG CDPL00001/
          cp pkg/PIC1.PNG CDPL00001/
          cp assets/font.ttf CDPL00001/USRDIR/assets/
          cp assets/default_cover.png CDPL00001/USRDIR/assets/
          if [ -f CDPL00001.self ]; then cp CDPL00001.self CDPL00001/USRDIR/EBOOT.BIN; fi
          if [ -f build/CDPL00001.pkg ]; then cp build/CDPL00001.pkg CDPL00001.pkg; fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CDPL00001-PS3-Package
          path: |
            *.pkg
            CDPL00001/
