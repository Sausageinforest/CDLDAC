name: Build PS3 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile PKG via PS3DEV Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/build -w /build hldtux/ps3dev make pkg
          cp CDLDAC001.self EBOOT.BIN

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CDLDAC-binaries
          path: |
            EBOOT.BIN
            CDLDAC001.self
            CDLDAC001.pkg
          if-no-files-found: error
