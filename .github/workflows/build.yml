name: Build PS3 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile PKG via PS3DEV Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/build -w /build hldtux/ps3dev make clean pkg
          mkdir -p CDPL00001/USRDIR/assets CDPL00001/USRDIR/cache
          cp pkg/PARAM.SFO CDPL00001/
          cp pkg/ICON0.PNG CDPL00001/
          cp pkg/PIC1.PNG CDPL00001/
          cp assets/font.ttf CDPL00001/USRDIR/assets/
          cp assets/default_cover.png CDPL00001/USRDIR/assets/
          if [ -f CDPL00001.self ]; then cp CDPL00001.self CDPL00001/USRDIR/EBOOT.BIN; fi
          zip -r CDPL00001-folder.zip CDPL00001
          ls -la
          ls -la build/ || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CDPL00001-PS3-Package
          path: |
            *.pkg
            *.self
            CDPL00001/
            CDPL00001-folder.zip

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "PS3 Audiophile CD Player v1.0.4 (CDPL00001)"
          body: |
            Official PSL1GHT build of PS3 Audiophile CD Player homebrew (TitleID: CDPL00001).

            ### Critical Fixes in v1.0.4
            - **Added `SYS_PROCESS_PARAM(1001, 0x100000)`**:
              * Fixed LV2 kernel abort on boot! Without `.sys_proc_param`, PS3 GameOS aborts before calling `main()`.
            - **Added `sprxlinker` ELF patching**:
              * Resolved dynamic SPRX imports and relocations for PSL1GHT system libraries prior to SELF conversion.
            - **Direct Retail Finalization (`package_finalize`)**:
              * `CDPL00001.pkg` is now finalized directly as a retail package, allowing flawless execution on CFW (CEX) and PS3HEN.
            - **Added `CDPL00001-fself.pkg`**:
              * An additional package with homebrew FSELF `EBOOT.BIN` that bypasses NPDRM DRM checks entirely.
            - **Expanded USB/HDD Logging Paths**:
              * Writes to `/dev_usb000` through `/dev_usb007`, `/dev_hdd0/tmp/cdplayer.log`, and `/dev_hdd0/game/CDPL00001/debug.log`.
          files: |
            CDPL00001.pkg
            CDPL00001-fself.pkg
            CDPL00001.gnpdrm.pkg
            CDPL00001.self
            CDPL00001-folder.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
