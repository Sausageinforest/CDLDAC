name: Build PS3 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile PKG via PS3DEV Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/build -w /build hldtux/ps3dev make pkg
          mkdir -p CDLDAC001/USRDIR
          cp build/pkg/PARAM.SFO CDLDAC001/
          cp build/pkg/ICON0.PNG CDLDAC001/
          cp build/pkg/USRDIR/EBOOT.BIN CDLDAC001/USRDIR/
          echo "192.168.1.50:12345" > CDLDAC001/USRDIR/config.txt

      - name: Upload Installed Folder
        uses: actions/upload-artifact@v4
        with:
          name: CDLDAC001-folder
          path: CDLDAC001
          if-no-files-found: error
