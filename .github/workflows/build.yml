name: Build PS3 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile PKG via PS3DEV Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/build -w /build hldtux/ps3dev make clean pkg
          mkdir -p CDPL00001/USRDIR/assets CDPL00001/USRDIR/cache
          cp pkg/PARAM.SFO CDPL00001/
          cp pkg/ICON0.PNG CDPL00001/
          cp pkg/PIC1.PNG CDPL00001/
          cp assets/font.ttf CDPL00001/USRDIR/assets/
          cp assets/default_cover.png CDPL00001/USRDIR/assets/
          if [ -f CDPL00001.self ]; then cp CDPL00001.self CDPL00001/USRDIR/EBOOT.BIN; fi
          zip -r CDPL00001-folder.zip CDPL00001
          ls -la
          ls -la build/ || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CDPL00001-PS3-Package
          path: |
            *.pkg
            *.self
            CDPL00001/
            CDPL00001-folder.zip

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "PS3 Audiophile CD Player v1.0.2 (CDPL00001)"
          body: |
            Official PSL1GHT build of PS3 Audiophile CD Player homebrew (TitleID: CDPL00001).

            ### Fixes in v1.0.2
            - Fixed "Corrupted Data" error in XMB by regenerating valid 1040-byte PARAM.SFO (CATEGORY: HG, BOOTABLE: 1, ATTRIBUTE: 0)
            - Fixed packaging with proper NPDRM Free DRM EBOOT.BIN
            - Both Debug PKG (`CDPL00001.pkg`) and Finalized PKG (`CDPL00001.gnpdrm.pkg`) provided
            - Added `CDPL00001-folder.zip` for direct copy to `/dev_hdd0/game/CDPL00001/` via FTP or multiMAN
          files: |
            CDPL00001.pkg
            CDPL00001.gnpdrm.pkg
            CDPL00001.self
            CDPL00001-folder.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
